<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Xfrend</title>
  <link rel="stylesheet" href="/ui.css">
</head>
<body>
  <div class="wrap">

    <div class="top">
      <div class="mascot">
        <div class="mascotFace"></div>
      </div>
      <div>
        <div class="title">Xfrend</div>
	<div class="subtitle">Talk, ask, or share anything • Tagalog or English</div>
      </div>
    </div>

<div class="bubbles">
  <div class="bubble">Pwede Tagalog o English</div>
  <div class="bubble">You can ask or just talk</div>
  <div class="bubble warn">For guidance only — not a professional substitute</div>
</div>

    <div class="card">
      <label for="q" class="muted">Type a message:</label>
      <textarea id="q" placeholder="Kumusta ka today? May gusto ka bang pag-usapan?"></textarea>

      <div class="row">
        <button id="send" class="btn">Send</button>
        <span id="status" class="muted"></span>
      </div>

      <div id="out" class="out"></div>
    </div>

    <div class="muted foot">
      Tip: Press Ctrl+Enter to send. Results may be imperfect—double-check important info.
    </div>

  </div>

<script>
  const q = document.getElementById('q');
  const out = document.getElementById('out');
  const statusEl = document.getElementById('status');
  const sendBtn = document.getElementById('send');
  let isSending = false;

  function setStatus(t){ statusEl.textContent = t || ''; }

  function addMessage(role, text){
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text || '';
    out.appendChild(div);
    out.scrollTop = out.scrollHeight;
  }

  async function ask(){
    if(isSending) return;

    const text = q.value.trim();
    if(!text) return;

    isSending = true;
    addMessage('user', text);
    q.value = '';

    setStatus('Thinking...');
    sendBtn.disabled = true;

    try{
      const r = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ q: text })
      });

      const raw = await r.text();

      let data;
      try{
        data = JSON.parse(raw);
      }catch{
        throw new Error(raw || 'Invalid server response');
      }

      addMessage('assistant', (data && (data.answer || data.text)) ? (data.answer || data.text) : JSON.stringify(data, null, 2));
      setStatus('');
    }catch(e){
      addMessage('assistant', 'Error: ' + (e && e.message ? e.message : e));
      setStatus('');
    }finally{
      sendBtn.disabled = false;
      isSending = false;
    }
  }

  sendBtn.addEventListener('click', ask);
  q.addEventListener('keydown', (e) => {
    if(e.ctrlKey && e.key === 'Enter') ask();
  });
</script>

</body>
</html>
